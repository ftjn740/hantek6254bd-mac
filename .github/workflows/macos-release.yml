name: macOS package

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to build and publish (blank builds without publishing)
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: macos-package-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
    outputs:
      version: ${{ steps.version.outputs.value }}
      checkout_ref: ${{ steps.version.outputs.checkout_ref }}
    steps:
      - name: Select version
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ -n "$RELEASE_TAG" ]]; then
            if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc[0-9]+)?$ ]]; then
              echo "Expected a version tag such as v0.1.0-rc2" >&2
              exit 1
            fi
            echo "value=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
            echo "checkout_ref=refs/tags/$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          else
            if [[ "$GITHUB_REF_TYPE" == tag ]]; then
              echo "value=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            else
              echo "value=v0.0.0-rc${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
            fi
            echo "checkout_ref=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.version.outputs.checkout_ref }}
          persist-credentials: false
      - name: Install Python and Tk
        run: brew install python@3.13 python-tk@3.13
      - name: Build and verify application
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: packaging/build-macos.sh "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: dist/${{ steps.version.outputs.value }}/
          if-no-files-found: error

  release:
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.checkout_ref }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: macos-arm64
          path: artifacts
      - name: Publish checked artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          (cd artifacts && sha256sum -c SHA256SUMS)
          flags=()
          if [[ "$VERSION" == *-rc* ]]; then
            flags+=(--prerelease --latest=false)
          fi
          gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$VERSION" --notes-file RELEASE_NOTES.md "${flags[@]}" \
            artifacts/"hantek6254bd-$VERSION-macos-arm64.zip" \
            artifacts/"hantek6254bd-$VERSION-source.tar.gz" \
            artifacts/libusb-1.0.29.tar.bz2 artifacts/SHA256SUMS
